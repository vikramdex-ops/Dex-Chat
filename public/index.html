<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Lattice</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23101820'/%3E%3Cpath d='M6 22 L16 8 L26 22' stroke='%23F2F4F1' stroke-width='2' fill='none'/%3E%3Ccircle cx='16' cy='8' r='3' fill='%23C77D12'/%3E%3C/svg%3E" />
</head>
<body>
<a class="skip" href="#input">Skip to message box</a>

<div id="app" hidden>
  <aside class="rail">
    <div class="brand" title="Lattice">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <path d="M6 25 L16 7 L26 25" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M10.5 19 H21.5" stroke="currentColor" stroke-width="1.25" opacity=".55" />
        <circle cx="16" cy="7" r="2.6" fill="currentColor" />
      </svg>
    </div>
    <nav class="rail-actions" aria-label="Main">
      <button id="btn-search" class="rail-btn" title="Search (Ctrl+K)" aria-label="Search">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16 L21 21" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button id="btn-new" class="rail-btn" title="New channel" aria-label="New channel">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button id="btn-browse" class="rail-btn" title="Browse channels" aria-label="Browse channels">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button id="btn-peers" class="rail-btn" title="People on this network" aria-label="People on this network">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="9" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="11" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6M15.5 19c.3-1.8 1.3-2.8 2.6-2.8 1.3 0 2.2 1 2.5 2.8" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
      <button id="btn-help" class="rail-btn" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.3v.4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
      </button>
    </nav>
    <div class="rail-foot">
      <button id="me-avatar" class="avatar-btn" title="You and settings" aria-label="Your settings">
        <span class="avatar" id="me-initials">?</span>
      </button>
    </div>
  </aside>

  <aside class="sidebar">
    <header class="sidebar-head">
      <div class="sidebar-head-row">
        <div>
          <div class="workspace" id="workspace-name">Office</div>
          <div class="conn" id="conn-state"><span class="dot" id="conn-dot"></span><span id="conn-label">connecting</span></div>
        </div>
        <button id="btn-mark-read" class="ghost-btn tiny" title="Mark everything as read">Mark read</button>
      </div>
    </header>
    <div class="sidebar-scroll">
      <div class="list-label">Channels</div>
      <ul class="chan-list" id="channel-list"></ul>
      <div class="list-label">Direct messages</div>
      <ul class="chan-list" id="dm-list"></ul>
      <div class="list-label">People</div>
      <ul class="people-list" id="people-list"></ul>
    </div>
  </aside>

  <main class="conversation" id="conversation">
    <header class="conv-head">
      <button id="sidebar-toggle" class="icon-btn only-narrow" aria-label="Show conversations">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <div class="conv-title">
        <h1 id="conv-name">Select a conversation</h1>
        <p id="conv-meta"></p>
      </div>
      <div class="conv-actions">
        <button id="btn-members" class="ghost-btn" title="People in this conversation">People</button>
        <button id="btn-pins" class="ghost-btn" title="Pinned messages">Pinned <span id="pin-count">0</span></button>
      </div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div>

    <div class="typing" id="typing" hidden></div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="reply-banner" id="reply-banner" hidden>
        <span>Replying to <b id="reply-name"></b></span>
        <button type="button" id="reply-cancel" aria-label="Cancel reply">×</button>
      </div>
      <div class="attach-banner" id="attach-banner" hidden>
        <span id="attach-name"></span>
        <span class="attach-progress" id="attach-progress"></span>
        <button type="button" id="attach-cancel" aria-label="Remove attachment">×</button>
      </div>
      <div class="composer-row">
        <button type="button" id="btn-attach" class="icon-btn" title="Attach a file" aria-label="Attach a file">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M14 6.5 8 12.5a3.5 3.5 0 0 0 5 5l7-7a5 5 0 0 0-7-7l-7 7a7 7 0 0 0 10 10l6-6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Write a message" maxlength="8000" aria-label="Message"></textarea>
        <button type="submit" id="btn-send" class="send-btn">Send</button>
      </div>
      <input type="file" id="file-input" multiple hidden />
    </form>
  </main>

  <aside class="threads" id="threads" hidden aria-label="Thread">
    <header class="threads-head">
      <div>
        <div class="list-label flush">Thread</div>
        <div class="threads-sub" id="thread-sub"></div>
      </div>
      <button id="thread-close" class="ghost-btn" aria-label="Close thread">Close</button>
    </header>
    <div class="thread-body" id="thread-body"></div>
    <form class="thread-composer" id="thread-form">
      <textarea id="thread-input" rows="1" placeholder="Reply in thread" aria-label="Reply in thread"></textarea>
      <button type="submit" class="send-btn">Reply</button>
    </form>
  </aside>
</div>

<div class="join" id="join">
  <div class="join-card">
    <svg viewBox="0 0 32 32" width="34" height="34" class="join-mark" aria-hidden="true">
      <path d="M6 25 L16 7 L26 25" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M10.5 19 H21.5" stroke="currentColor" stroke-width="1.25" opacity=".55" />
      <circle cx="16" cy="7" r="2.6" fill="currentColor" />
    </svg>
    <h1>Lattice</h1>
    <p class="join-sub">Messages and files that never leave the office network.</p>
    <form id="join-form">
      <label for="name-input">Your name</label>
      <input id="name-input" name="name" maxlength="40" placeholder="e.g. Priya Raman" required autocomplete="name" />
      <label for="device-input">Device label</label>
      <input id="device-input" name="device" maxlength="60" placeholder="Accounts laptop" autocomplete="off" />
      <button type="submit" class="primary-btn">Enter workspace</button>
      <p class="join-note" id="join-note">Checking the office server…</p>
    </form>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head">
      <h2 id="sheet-title">Search</h2>
      <button id="sheet-close" class="ghost-btn" aria-label="Close">Close</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="/app.js" type="module"></script>
</body>
</html>
