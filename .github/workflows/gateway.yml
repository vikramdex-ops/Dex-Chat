# Deploys the internet gateway (apps/gateway) to the office's Cloudflare account.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers")
# and CLOUDFLARE_ACCOUNT_ID. Optional: HUB_FINGERPRINT (Control room > Outside the office), which
# pins the gateway to the office hub. Run it from Actions > gateway > Run workflow; it also runs
# when the gateway's code changes on main.
name: gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/gateway/**"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Cloudflare secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repository's secrets to deploy the gateway."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: steps.check.outputs.ok == 'true'
      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUB_FINGERPRINT: ${{ secrets.HUB_FINGERPRINT }}
        run: |
          npx wrangler deploy | tee deploy.log
          if [ -n "$HUB_FINGERPRINT" ]; then printf '%s' "$HUB_FINGERPRINT" | npx wrangler secret put HUB_FINGERPRINT; fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Gateway deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Paste this address into Control room > Outside the office: **${url}**" >> "$GITHUB_STEP_SUMMARY"
