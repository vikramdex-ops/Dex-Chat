name: build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the API suite
        run: node --test tests/

  installers:
    name: installers (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable
            artifact: windows
          - os: ubuntu-latest
            target: --linux AppImage deb
            artifact: linux
          - os: macos-latest
            target: --mac dmg
            artifact: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install build tooling
        run: npm ci
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: List what was produced
        shell: bash
        run: ls -la dist || dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: lattice-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
