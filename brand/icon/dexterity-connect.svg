<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dexterity Connect app icon: a "D" that is also a speech bubble, with an amber spark
       (a message, a person online, a connection made) at its heart. -->
  <defs>
    <linearGradient id="bg" x1="72" y1="40" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3aa3ae"/>
      <stop offset=".55" stop-color="#1c7680"/>
      <stop offset="1" stop-color="#123a3f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="256" y1="32" x2="256" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(262 238) scale(46)">
      <stop offset="0" stop-color="#ffd38a"/>
      <stop offset=".6" stop-color="#f7af44"/>
      <stop offset="1" stop-color="#e8921e"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06191b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#sheen)"/>
  <g filter="url(#lift)">
    <path fill="#ffffff" fill-rule="evenodd" d="
      M150 120 H274 C356 120 410 178 410 256 C410 334 356 392 274 392 H214 L150 436 Z
      M210 180 V332 H272 C319 332 350 300 350 256 C350 212 319 180 272 180 Z"/>
    <circle cx="272" cy="256" r="38" fill="url(#spark)"/>
  </g>
</svg>
