<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- maximum-scale stops Safari zooming into a field on focus; people can still pinch to zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef3f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1b1d" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dexterity" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Dexterity Connect for iPhone: messages, calls and files from your office." />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="icon" href="/app/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
  <!--startup-->
  <title>Dexterity Connect</title>
  <style>
    /* shown until the app draws itself: no flash of white in dark mode */
    html { background: #eef3f3; } @media (prefers-color-scheme: dark) { html { background: #0e1b1d; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript>Dexterity Connect needs JavaScript. Switch it on in Settings ▸ Apps ▸ Safari ▸ Advanced.</noscript>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
